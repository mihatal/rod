async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:IT,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},key,u(C));
  const html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem('rod_pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
